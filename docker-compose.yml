services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: campus_life
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./campus-backend/src/main/resources/db:/docker-entrypoint-initdb.d
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: campus-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --requirepass redis123
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot 后端应用
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: campus-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: campus_life
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: campus-life-platform-secret-key-change-in-production
      JWT_EXPIRATION: 604800000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campus-network

  # Nginx 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: campus-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campus-network

# 网络配置
networks:
  campus-network:
    driver: bridge
